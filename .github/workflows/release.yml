name: release

on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Compute version
        run: |
          day=$(date -u +%Y%m%d)
          last=$(git ls-remote --tags origin "refs/tags/v$day.*" | sed -E 's|.*refs/tags/v[0-9]+\.([0-9]+)$|\1|' | sort -n | tail -n1)
          echo "VERSION=$day.$(( ${last:-0} + 1 ))" >> "$GITHUB_ENV"
      - name: Fetch source pages
        run: uv run fetch.py
      - name: Build docset
        run: uv run build.py
      - name: Test
        run: uv run --with pytest --with beautifulsoup4 --with lxml pytest -q test_docset.py
      - name: Package
        run: tar -czf "GoogleAppsScript.docset-$VERSION.tar.gz" GoogleAppsScript.docset
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "GoogleAppsScript.docset-$VERSION.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "Docset generated by code from commit $GITHUB_SHA. Documentation content © Google, CC BY 4.0; code samples Apache 2.0."
